# CI for the clinical reasoning engine.
# Runs on every pull request into main and every push to main.
#   web/     -> Next.js app (Vercel "Root Directory" = web)
#   engine/  -> Python trajectory-matching code (Arad), job added later

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If someone pushes twice quickly to the same PR, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web-checks          # this is the name you'll mark as "required" in the ruleset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

